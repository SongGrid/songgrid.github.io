<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>SongGrid</title>
</head>

<body>
    <script>
        const route = window.location.pathname +
            window.location.search +
            window.location.hash;

        window.location.replace(
            "/?route=" + encodeURIComponent(route)
        );
    </script>
</body>

</html>
